steps:
  # Build the container image with extended timeout
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/vision8-backend', '.']
    timeout: '1800s'  # 30 minutes for build
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/vision8-backend']
    timeout: '600s'   # 10 minutes for push
  
  # Deploy container image to Cloud Run with enhanced configuration
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'vision8-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/vision8-backend'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8000'
      - '--memory'
      - '4Gi'           # Increased memory for video processing
      - '--cpu'
      - '4'             # Increased CPU for better performance
      - '--timeout'
      - '3600'          # 1 hour request timeout
      - '--concurrency'
      - '10'            # Limit concurrent requests per instance
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '1'             # Keep at least 1 instance warm
      - '--set-env-vars'
      - 'API_HOST=0.0.0.0,API_PORT=8000,API_DEBUG_MODE=false,LOG_LEVEL=INFO,CORS_ORIGINS=https://vision8-e7683.web.app,API_BASE_URL=https://vision8-backend-xyz-uc.a.run.app,ELASTIC_INDEX=scene_segments,GOOGLE_CLOUD_PROJECT=vision8-474519,REDIS_URL=redis://redis-16064.c238.us-central1-2.gce.redns.redis-cloud.com:16064/0,REDIS_PASSWORD=7PPYVJmZjtFgxJW4FK1xwYiBvoZTaVAh'
      - '--set-secrets'
      - 'GEMINI_API_KEY=gemini-api-key:latest,ELASTIC_URL=elastic-url:latest,ELASTIC_API_KEY=elastic-api-key:latest,LANGCACHE_API_KEY=langcache-api-key:latest'
    timeout: '600s'     # 10 minutes for deployment

# Global timeout for entire build process
timeout: '7200s'        # 2 hours total timeout

# Enhanced build options
options:
  machineType: 'E2_HIGHCPU_8'  # Use high-CPU machine for faster builds
  diskSizeGb: 100               # Larger disk for build artifacts
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/$PROJECT_ID/vision8-backend'